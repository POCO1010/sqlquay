name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
      - run: npm ci --ignore-scripts
      - run: npm run check:public
      - run: npm test
      - run: npm run test:jdbc
      - run: npm run test:dms
      - run: npm run package
      - run: npm run package:migration
      - uses: actions/upload-artifact@v7
        with:
          name: sqlquay-vsix
          path: artifacts/sqlquay-*.vsix
          if-no-files-found: error
          retention-days: 7
